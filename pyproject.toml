[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real_robo"
version = "1.0.0"
requires-python = "==3.10.*"
description = "REAL-ROBO: An integrated framework for robotic teleoperation and control."
dependencies = [
    "numpy",
    "pyyaml",
    "easydict",
    "termcolor",
    "zmq",
    "protobuf==3.20.3",
    "pybullet==3.2.7",

]

[tool.setuptools]
packages = ["real_robo"]
